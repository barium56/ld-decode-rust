name: CI

# Windows x86-64 and Linux x86-64, both deliberately x86-64: the vendored
# ducc0 FFT in `crates/ld-decode/build.rs` is compiled at the 128-bit SIMD
# baseline (SSE2 on x86-64) with no AVX/FMA, single-threaded, so that it
# reproduces the rounding of the scipy 1.18.0 wheel this port is parity-locked
# to. On Windows that is clang-cl with MSVC ABI/STL; on Linux clang++/g++ with
# the GNU dialect. ducc0 selects its SIMD width from the compiler's predefined
# macros, so both select the same kernels.
#
# The real end-to-end gate is b3sum 4/4 against the `F:\DdD` references, which
# needs the capture files and hours of runtime; it stays a local, manual check.
# What CI can gate is everything below that: build, the hermetic scipy/numpy
# fidelity tests, and a full CLI run through every output writer.
#
# Do not set RUSTFLAGS in these workflows: an env RUSTFLAGS replaces
# `.cargo/config.toml`'s `target-cpu=x86-64-v3`, which is part of the verified
# release configuration.
#
# The hermetic FFT/filter fidelity tests compare against scipy goldens that are
# themselves platform-dependent (ducc0 builds its twiddles from the platform C
# library's sin/cos), so each platform's set is committed: Windows in
# `crates/ld-decode/tests/data`, Linux in `crates/ld-decode/tests/data/linux`.
# The test suites therefore need no setup at all and run identically here, in
# `release.yml` and on a developer machine; `--verify` is what gates the sets.
# scripts/gen_scipy_fft_goldens.py explains the arrangement.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  windows:
    name: Build, test and smoke (windows x86_64)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          # Pinned to the nightly this port is developed and verified with.
          # Several tests assert bit-level agreement with scipy 1.18.0
          # references, and codegen drift between nightlies moves them.
          toolchain: nightly-2026-08-29

      - name: Install Python (for the scipy golden verification)
        # The pinned scipy 1.18.0 wheel needs CPython >= 3.12.
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build release
        shell: bash
        run: cargo build --release --workspace

      - name: Verify the committed scipy goldens
        shell: bash
        # Proves the golden-generation recipes still reproduce the committed
        # Windows reference files bit-for-byte, so an accidental edit to a golden
        # fails here instead of silently widening a parity gate. Skips with a
        # warning if the pinned wheels are missing.
        run: |
          set -euo pipefail
          if ! PY="$(bash .github/scripts/scipy_venv.sh)"; then
            echo "::warning::pinned numpy/scipy unavailable; skipping the golden verify"
            exit 0
          fi
          "$PY" scripts/gen_scipy_fft_goldens.py --verify

      - name: Test (debug profile)
        shell: bash
        # The debug profile is where the filter/FFT fidelity gates are exact;
        # release codegen drifts ~1e-14 on `gen_bpf_supergauss`, which is why
        # the test tolerances sit at 1e-12. `pll_matches_stock_field_stream`
        # needs the LD_PLL_DIR golden field stream dumped from a stock Python
        # run, which is not in the repo, so it is skipped in both profiles.
        run: cargo test --workspace -- --skip pll_matches_stock_field_stream

      - name: Test (release profile)
        shell: bash
        run: cargo test --workspace --release -- --skip pll_matches_stock_field_stream

      - name: Install FFmpeg
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install ffmpeg --yes --no-progress
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            throw 'FFmpeg was not added to PATH'
          }
          ffmpeg -version | Select-Object -First 1

      - name: Smoke test the decoder
        shell: bash
        run: bash .github/scripts/smoke.sh target/release/ld-decode.exe

      - name: Upload decoder binary
        # Pull requests do not need a downloadable binary; release.yml is the
        # workflow that produces versioned archives (dispatch it with
        # create_release=false for artifacts and no release).
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: ld-decode-windows-x86_64
          path: target/release/ld-decode.exe
          if-no-files-found: error

  linux:
    name: Build, test and smoke (linux x86_64)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-08-29

      - name: Install C++ toolchain and FFmpeg
        # build.rs needs a C++17 compiler with the GNU dialect (clang++ is
        # preferred, g++ is the fallback) plus the C++ runtime headers;
        # `build-essential` supplies libstdc++-dev and the fallback g++. The
        # `bundled` SQLite feature of rusqlite also compiles C here.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential clang ffmpeg
          clang++ --version | head -1
          ffmpeg -version | head -1

      - name: Install Python (for the scipy goldens)
        # The pinned scipy 1.18.0 wheel needs CPython >= 3.12; ubuntu-22.04's
        # default python3 is 3.10, for which that wheel does not exist.
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build release
        run: cargo build --release --workspace

      - name: Smoke test the decoder
        # Deliberately before the test suite: a failing test step would
        # otherwise hide whether the Linux binary decodes at all.
        run: bash .github/scripts/smoke.sh target/release/ld-decode

      - name: Measure scipy cross-platform drift (census)
        # The vendored ducc0 builds its twiddle factors from the platform C
        # library's sin/cos (vendor/ducc0/math/unity_roots.h), so the FFT -- and
        # therefore the reference outputs -- differ between UCRT and glibc by
        # 1-2 ulp. This measures exactly that: scipy 1.18.0 on this runner,
        # computed from the committed platform-independent inputs, diffed against
        # the committed *Windows* goldens (--ref names that set explicitly, since
        # the default for a Linux run would be the Linux set, which by definition
        # matches). It is a measurement, not a gate: it always exits 0.
        run: |
          set -euo pipefail
          if ! PY="$(bash .github/scripts/scipy_venv.sh)"; then
            echo "::warning::pinned numpy/scipy unavailable; skipping the census"
            exit 0
          fi
          "$PY" scripts/gen_scipy_fft_goldens.py --census --ref crates/ld-decode/tests/data

      - name: Verify the committed scipy goldens
        # Parity here means "matches the Python reference running on the *same*
        # platform", which is the only available target: the reference's own FFT
        # twiddles come from the platform libm, so the Windows and Linux scipy
        # references are not the same numbers. The committed Linux set in
        # `tests/data/linux` was generated by this same script under the same
        # pinned wheels; `--verify` recomputes it from the committed inputs and
        # fails if this runner's libm/wheels have drifted from it. That is a
        # strictly stronger gate than regenerating (which can never fail), and it
        # is why the test steps below -- and `release.yml`'s -- need no Python.
        # Hard-fails if the pinned wheels are unavailable: without a
        # platform-local reference the fidelity tests would be meaningless.
        run: |
          set -euo pipefail
          PY="$(bash .github/scripts/scipy_venv.sh)"
          "$PY" scripts/gen_scipy_fft_goldens.py --verify

      - name: Test (debug profile)
        run: cargo test --workspace -- --skip pll_matches_stock_field_stream

      - name: Test (release profile)
        run: cargo test --workspace --release -- --skip pll_matches_stock_field_stream

      - name: Upload decoder binary
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: ld-decode-linux-x86_64
          path: target/release/ld-decode
          if-no-files-found: error
