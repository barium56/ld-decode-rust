name: CI

# Windows x86-64 and Linux x86-64, both deliberately x86-64: the vendored
# ducc0 FFT in `crates/ld-decode/build.rs` is compiled at the 128-bit SIMD
# baseline (SSE2 on x86-64) with no AVX/FMA, single-threaded, so that it
# reproduces the rounding of the scipy 1.18.0 wheel this port is parity-locked
# to. On Windows that is clang-cl with MSVC ABI/STL; on Linux clang++/g++ with
# the GNU dialect. ducc0 selects its SIMD width from the compiler's predefined
# macros, so both select the same kernels.
#
# The real end-to-end gate is b3sum 4/4 against the `F:\DdD` references, which
# needs the capture files and hours of runtime; it stays a local, manual check.
# What CI can gate is everything below that: build, the hermetic scipy/numpy
# fidelity tests, and a full CLI run through every output writer.
#
# Do not set RUSTFLAGS in these workflows: an env RUSTFLAGS replaces
# `.cargo/config.toml`'s `target-cpu=x86-64-v3`, which is part of the verified
# release configuration.
#
# The hermetic FFT/filter fidelity tests compare against ONE committed golden
# set for both platforms. ducc0 would otherwise build its twiddles from the
# platform C library's sin/cos, and UCRT and glibc disagree by 1-2 ulp on a few
# percent of arguments; instead, non-Windows targets call bit-exact ports of the
# UCRT functions (`crates/ld-decode/src/optimized/ucrt_math.rs`, wired in by
# `build.rs`), so Linux reproduces the Windows values exactly. The test suites
# therefore need no setup at all and run identically here, in `release.yml` and
# on a developer machine. The Windows job's `--verify` gates the set against the
# recipes that produced it; the Linux job's `--census` measures how far the
# local scipy is from it, which is the drift the ports neutralise.
# scripts/gen_scipy_fft_goldens.py explains the arrangement.
#
# The same split applies to the filter bank, which is *constructed* rather than
# loaded from data: `spec::tests::construction_is_platform_independent` pins a
# hash of every constructed filter, the measured delays and the sinc LUT across
# six request variants (default, --lowband, the colour notch, custom
# de-emphasis, MTF level and the decoder-param overrides), and expects identical
# values on both platforms. It is the only test whose whole purpose is that the
# two agree, and it is what caught the construction path still calling the
# platform libm for `np.sin`/`np.cos`/`np.exp`/`np.power` on Linux (the filters
# differed in ~84% of their elements until those sites were routed through the
# UCRT ports). Because the variants are pinned, it also gates options the decode
# tests never exercise -- it is what caught `--lowband` being a silent no-op.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  windows:
    name: Build, test and smoke (windows x86_64)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          # Pinned to the nightly this port is developed and verified with.
          # Several tests assert bit-level agreement with scipy 1.18.0
          # references, and codegen drift between nightlies moves them.
          toolchain: nightly-2026-08-29

      - name: Install Python (for the scipy golden verification)
        # The pinned scipy 1.18.0 wheel needs CPython >= 3.12.
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build release
        shell: bash
        run: cargo build --release --workspace

      - name: Verify the committed scipy goldens
        shell: bash
        # Proves the golden-generation recipes still reproduce the committed
        # Windows reference files bit-for-byte, so an accidental edit to a golden
        # fails here instead of silently widening a parity gate.
        #
        # Failing to set up the pinned wheels now fails the job rather than
        # warning: this is the only place the committed set is recomputed from
        # its recipes, and a gate that silently does not run is worse than a red
        # build. Windows is the platform that must be able to reproduce the set,
        # because the set is Windows-generated. (The Linux job's `--census`
        # keeps the soft path -- it is a measurement, not a gate.)
        run: |
          set -euo pipefail
          if ! PY="$(bash .github/scripts/scipy_venv.sh)"; then
            echo "::error::could not install the pinned numpy 2.4.6 / scipy 1.18.0 wheels; the golden verify is the Windows parity gate and must not be skipped"
            exit 1
          fi
          "$PY" scripts/gen_scipy_fft_goldens.py --verify

      - name: Install FFmpeg
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install ffmpeg --yes --no-progress
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            throw 'FFmpeg was not added to PATH'
          }
          ffmpeg -version | Select-Object -First 1

      - name: Smoke test the decoder
        # Deliberately before the test suite, exactly as in the Linux job: a
        # failing test step would otherwise hide whether the binary decodes at
        # all, which is the more useful signal to see first.
        shell: bash
        run: bash .github/scripts/smoke.sh target/release/ld-decode.exe

      - name: Test (debug profile)
        shell: bash
        # The debug profile is where the filter/FFT fidelity gates are exact;
        # release codegen drifts ~1e-14 on `gen_bpf_supergauss`, which is why
        # the test tolerances sit at 1e-12. `pll_matches_stock_field_stream`
        # needs the LD_PLL_DIR golden field stream dumped from a stock Python
        # run, which is not in the repo, so it is skipped in both profiles.
        run: cargo test --workspace -- --skip pll_matches_stock_field_stream

      - name: Test (release profile)
        shell: bash
        run: cargo test --workspace --release -- --skip pll_matches_stock_field_stream

      - name: Upload decoder binary
        # Pull requests do not need a downloadable binary; release.yml is the
        # workflow that produces versioned archives (dispatch it with
        # create_release=false for artifacts and no release).
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: ld-decode-windows-x86_64
          path: target/release/ld-decode.exe
          if-no-files-found: error

  linux:
    name: Build, test and smoke (linux x86_64)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-08-29

      - name: Install C++ toolchain and FFmpeg
        # build.rs needs a C++17 compiler with the GNU dialect (clang++ is
        # preferred, g++ is the fallback) plus the C++ runtime headers;
        # `build-essential` supplies libstdc++-dev and the fallback g++. The
        # `bundled` SQLite feature of rusqlite also compiles C here.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential clang ffmpeg
          clang++ --version | head -1
          ffmpeg -version | head -1

      - name: Install Python (for the scipy goldens)
        # The pinned scipy 1.18.0 wheel needs CPython >= 3.12; ubuntu-22.04's
        # default python3 is 3.10, for which that wheel does not exist.
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build release
        run: cargo build --release --workspace

      - name: Smoke test the decoder
        # Deliberately before the test suite: a failing test step would
        # otherwise hide whether the Linux binary decodes at all.
        run: bash .github/scripts/smoke.sh target/release/ld-decode

      - name: Measure scipy cross-platform drift (census)
        # The reference's own FFT twiddles come from the platform libm, so
        # scipy-on-Linux and scipy-on-Windows are not the same numbers, and this
        # run quantifies that: scipy 1.18.0 here, from the committed
        # platform-independent inputs, diffed against the committed (Windows)
        # goldens that the Rust tests now reproduce on both platforms. It is
        # documentation of what the UCRT ports neutralise, not a gate: it always
        # exits 0. The Rust side is unaffected -- it matches the committed set
        # regardless of what this prints.
        run: |
          set -euo pipefail
          if ! PY="$(bash .github/scripts/scipy_venv.sh)"; then
            echo "::warning::pinned numpy/scipy unavailable; skipping the census"
            exit 0
          fi
          "$PY" scripts/gen_scipy_fft_goldens.py --census

      - name: Test (debug profile)
        run: cargo test --workspace -- --skip pll_matches_stock_field_stream

      - name: Test (release profile)
        run: cargo test --workspace --release -- --skip pll_matches_stock_field_stream

      - name: Upload decoder binary
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: ld-decode-linux-x86_64
          path: target/release/ld-decode
          if-no-files-found: error
