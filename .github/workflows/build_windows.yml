name: "Build Windows decoder"

# Manual, artifact-producing build of `ld-decode.exe` (no release is created
# here; see release.yml for that). Mirrors build_windows_decode.yml in the
# sibling tape-decode-gui project, minus the launcher bundling and minus the
# x86-64 microarch levels: this decoder ships as a single binary, and
# `.cargo/config.toml` fixes the release ISA level at `target-cpu=x86-64-v3`
# (setting RUSTFLAGS would silently override that). The vendored ducc0 FFT is
# compiled separately by build.rs and stays SSE2 on purpose -- that is a parity
# requirement, not an oversight.

on:
  workflow_dispatch:
    inputs:
      toolchain:
        description: "Rust toolchain to build with"
        required: false
        type: string
        default: "nightly-2026-08-28"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-decode:
    name: Build ld-decode.exe (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: windows-2022
            target: x86_64-pc-windows-msvc
            artifact_suffix: x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: ${{ inputs.toolchain }}
          targets: ${{ matrix.target }}

      - name: Resolve build version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          elif [[ "${GITHUB_REF_NAME}" == v* ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="$(git describe --tags --always --dirty)"
          fi
          VERSION="${VERSION#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building version ${VERSION} for ${{ matrix.target }}"

      - name: Build release
        shell: bash
        run: cargo build --release --workspace --target "${{ matrix.target }}"

      - name: Test (release profile)
        shell: bash
        # `pll_matches_stock_field_stream` needs the LD_PLL_DIR golden field
        # stream dumped from a stock Python run, which is not in the repo.
        run: cargo test --workspace --release --target "${{ matrix.target }}" -- --skip pll_matches_stock_field_stream

      - name: Smoke test the decoder
        shell: bash
        run: |
          set -euo pipefail
          BIN="target/${{ matrix.target }}/release/ld-decode.exe"
          if [ ! -f "$BIN" ]; then
            echo "No decoder binary at $BIN"
            exit 1
          fi

          "$BIN" --help > build-help.txt
          grep -q -- "--start" build-help.txt
          grep -q -- "--threads" build-help.txt

          mkdir -p smoke
          head -c 40000000 /dev/zero > smoke/zeros.s16
          "$BIN" -j 4 -l 4 smoke/zeros.s16 smoke/out

          for ext in tbc pcm efm tbc.json tbc.db log; do
            if [ ! -f "smoke/out.$ext" ]; then
              echo "Missing output: smoke/out.$ext"
              ls -la smoke
              exit 1
            fi
          done
          grep -q '"fields":\[\]' smoke/out.tbc.json
          grep -q "Decode finished" smoke/out.log

      - name: Package versioned ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Version = '${{ steps.version.outputs.version }}'
          $BinPath = "target\${{ matrix.target }}\release\ld-decode.exe"
          if (-not (Test-Path $BinPath)) { throw "missing $BinPath" }
          $ExeName = "ld-decode-windows_${Version}_${{ matrix.artifact_suffix }}.exe"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -Path $BinPath -Destination "dist\$ExeName" -Force
          $ZipName = "ld-decode-windows_${Version}_${{ matrix.artifact_suffix }}.zip"
          Compress-Archive -Path @("dist\$ExeName") -DestinationPath $ZipName -Force
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $ZipName))
          try {
            if ($zip.Entries.Count -ne 1) {
              throw "Expected 1 entry in $ZipName, found $($zip.Entries.Count)"
            }
            foreach ($entry in $zip.Entries) {
              if ($entry.FullName.Contains('/') -or $entry.FullName.Contains('\')) {
                throw "ZIP entry is nested; expected flat layout: $($entry.FullName)"
              }
            }
          } finally {
            $zip.Dispose()
          }
          Get-Item $ZipName | Format-List Name, Length

      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v7
        with:
          name: ld-decode-windows-${{ matrix.arch }}
          path: ld-decode-windows_*.zip
          if-no-files-found: error

      - name: Upload raw decoder binary
        uses: actions/upload-artifact@v7
        with:
          name: ld-decode-windows-${{ matrix.arch }}-binary
          path: target/${{ matrix.target }}/release/ld-decode.exe
          if-no-files-found: error
